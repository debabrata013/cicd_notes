name: CI/CD Pipeline & Automated Deployment

on:
  push:
    branches:
      - testing
      - main
  pull_request:
    branches:
      - testing
      - main

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Unit Testing & Code Coverage
  # ----------------------------------------------------------------------------
  test_and_coverage:
    name: Run Tests & Check Coverage
    runs-on: ubuntu-latest
    outputs:
      coverage_pct: ${{ steps.coverage.outputs.pct }}
      coverage_met: ${{ steps.coverage.outputs.met }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Enforce Branch Promotion Rule (dev -> testing -> main)
        if: github.event_name == 'pull_request'
        run: |
          TARGET_BRANCH="${{ github.base_ref }}"
          SOURCE_BRANCH="${{ github.head_ref }}"
          echo "🔍 Evaluating PR Flow: $SOURCE_BRANCH ➔ $TARGET_BRANCH"

          if [ "$TARGET_BRANCH" = "testing" ] && [ "$SOURCE_BRANCH" != "dev" ]; then
            echo "❌ Violation: Pull Requests targeting 'testing' MUST originate from the 'dev' branch."
            echo "Allowed Flow: dev ➔ testing ➔ main"
            exit 1
          fi

          if [ "$TARGET_BRANCH" = "main" ] && [ "$SOURCE_BRANCH" != "testing" ]; then
            echo "❌ Violation: Pull Requests targeting 'main' MUST originate from the 'testing' branch."
            echo "Allowed Flow: dev ➔ testing ➔ main"
            exit 1
          fi

          echo "✅ Branch promotion rule satisfied: $SOURCE_BRANCH ➔ $TARGET_BRANCH"

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Execute Tests & Generate Code Coverage
        run: npm run test:coverage

      - name: Evaluate Code Coverage Threshold (>= 80%)
        id: coverage
        run: |
          COVERAGE_PCT=$(node -e "const s = require('./coverage/coverage-summary.json'); console.log(s.total.lines.pct);")
          echo "Calculated Code Coverage: ${COVERAGE_PCT}%"
          echo "pct=${COVERAGE_PCT}" >> $GITHUB_OUTPUT

          # Check if coverage is greater than or equal to 80%
          IS_MET=$(node -e "console.log(${COVERAGE_PCT} >= 80);")
          if [ "$IS_MET" = "true" ]; then
            echo "✅ Code coverage threshold met (${COVERAGE_PCT}% >= 80%)."
            echo "met=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Code coverage threshold NOT met (${COVERAGE_PCT}% < 80%)."
            echo "met=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Test & Code Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: |
            coverage/
            coverage/coverage-summary.json
            coverage/lcov-report/
          retention-days: 7

  # ----------------------------------------------------------------------------
  # Job 2: Build Multi-Stage Docker Image & Trivy Security Scan
  # ----------------------------------------------------------------------------
  build_and_scan:
    name: Build Docker Image & Trivy Security Scan
    needs: test_and_coverage
    if: needs.test_and_coverage.outputs.coverage_met == 'true' && (github.ref == 'refs/heads/main' || github.base_ref == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/testing' || github.ref == 'refs/heads/main')
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image Locally
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: starlight-notes:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner (Fails on CRITICAL vulnerabilities)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "starlight-notes:local"
          format: "table"
          output: "trivy-scan-report.txt"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"

      - name: Upload Trivy Security Scan Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-scan-report.txt
          retention-days: 7

      - name: Build and Push Docker Image to Docker Hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/testing' || github.ref == 'refs/heads/main')
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/starlight-notes:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/starlight-notes:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Job 3: Continuous Deployment (CD) to VPS
  # ----------------------------------------------------------------------------
  deploy_vps:
    name: Deploy Latest Image to VPS
    needs: [test_and_coverage, build_and_scan]
    if: |
      always() && 
      (needs.build_and_scan.result == 'success' || (github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'testing')) &&
      (github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main'))
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "🚀 Starting Deployment on VPS..."

            # Log in to Docker Hub on VPS
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Pull latest Docker image
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/starlight-notes:latest

            # Stop and remove existing container if running
            docker stop starlight-notes 2>/dev/null || true
            docker rm starlight-notes 2>/dev/null || true

            # Run new container
            docker run -d \
              --name starlight-notes \
              --restart unless-stopped \
              -p 3000:3000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/starlight-notes:latest

            # Clean up old unused images
            docker image prune -f

            echo "✅ Deployment successful! Starlight Notes is now live on VPS."
