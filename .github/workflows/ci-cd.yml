name: CI/CD Pipeline

on:
  push:
    branches:
      - testing
      - main

  pull_request:
    branches:
      - testing
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/starlight-notes

jobs:

  # ============================================================
  # 1. TEST + COVERAGE
  # ============================================================
  test:
    name: Test & Code Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests & Coverage
        run: npm run test:coverage

      - name: Check Coverage >= 80%
        run: |
          COVERAGE=$(node -e "
            const summary = require('./coverage/coverage-summary.json');
            console.log(summary.total.lines.pct);
          ")

          echo "Code Coverage: ${COVERAGE}%"

          if node -e "process.exit(${COVERAGE} >= 80 ? 0 : 1)"; then
            echo "✅ Coverage requirement satisfied."
          else
            echo "❌ Coverage is below 80%."
            exit 1
          fi

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: code-coverage-report
          path: coverage/
          retention-days: 7


  # ============================================================
  # 2. BUILD + TRIVY SECURITY SCAN
  # ============================================================
  build-and-scan:
    name: Build Docker Image & Security Scan
    needs: test

    # Only build Docker image for pushes to testing/main
    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------------------------------
      # Build image locally
      # --------------------------------------------------------
      - name: Build Docker Image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: |
            starlight-notes:scan
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------------
      # Trivy vulnerability scan
      # --------------------------------------------------------
      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: starlight-notes:scan
          format: table
          output: trivy-report.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: trivy-security-report
          path: trivy-report.txt
          retention-days: 7

      # --------------------------------------------------------
      # Push image only after successful Trivy scan
      # --------------------------------------------------------
      - name: Push Docker Image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true

          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ============================================================
  # 3. DEPLOY TO VPS
  # ============================================================
  deploy:
    name: Deploy to Production VPS
    needs:
      - test
      - build-and-scan

    # ONLY main push deploys to VPS
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.test.result == 'success' &&
      needs.build-and-scan.result == 'success'

    runs-on: ubuntu-latest

    steps:

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}

          script_stop: true

          script: |

            set -e

            echo "======================================"
            echo "🚀 Starting Starlight Notes Deployment"
            echo "======================================"

            # --------------------------------------------------
            # Docker Hub Login
            # --------------------------------------------------
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
              docker login \
              --username "${{ secrets.DOCKERHUB_USERNAME }}" \
              --password-stdin

            # --------------------------------------------------
            # Pull new image
            # --------------------------------------------------
            echo "📦 Pulling latest Docker image..."

            docker pull \
              ${{ secrets.DOCKERHUB_USERNAME }}/starlight-notes:latest

            # --------------------------------------------------
            # Stop old container
            # --------------------------------------------------
            echo "🛑 Stopping old container..."

            docker stop starlight-notes 2>/dev/null || true

            docker rm starlight-notes 2>/dev/null || true

            # --------------------------------------------------
            # Start new container
            # --------------------------------------------------
            echo "🚀 Starting new container..."

            docker run -d \
              --name starlight-notes \
              --restart unless-stopped \
              -p 3000:3000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/starlight-notes:latest

            # --------------------------------------------------
            # Wait for container
            # --------------------------------------------------
            echo "⏳ Waiting for application..."

            sleep 5

            # --------------------------------------------------
            # Verify container is running
            # --------------------------------------------------
            if docker ps --filter "name=starlight-notes" --filter "status=running" | grep -q starlight-notes; then
              echo "✅ Container is running."
            else
              echo "❌ Container failed to start."
              docker logs starlight-notes
              exit 1
            fi

            # --------------------------------------------------
            # Cleanup old images
            # --------------------------------------------------
            echo "🧹 Cleaning unused Docker images..."

            docker image prune -f

            echo "======================================"
            echo "✅ Deployment Successful"
            echo "======================================"
