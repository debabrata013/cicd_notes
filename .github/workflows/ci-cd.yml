name: CI/CD Pipeline

on:
  push:
    branches:
      - testing
      - main

  pull_request:
    branches:
      - testing
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test & Code Coverage
    runs-on: ubuntu-latest

    if: ! (github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'testing')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests & Coverage
        run: npm run test:coverage

      - name: Check Code Coverage
        run: |

          COVERAGE=$(node -e "
            const summary = require('./coverage/coverage-summary.json');
            console.log(summary.total.lines.pct);
          ")

          echo "======================================"
          echo "Code Coverage: ${COVERAGE}%"
          echo "Required Coverage: 80%"
          echo "======================================"

          if node -e "process.exit(${COVERAGE} >= 80 ? 0 : 1)"
          then
            echo " Coverage requirement satisfied."
          else
            echo " Coverage is below 80%."
            exit 1
          fi

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-report
          path: coverage/
          retention-days: 7

  branch-policy:
    name: Validate Branch Promotion
    runs-on: ubuntu-latest

    if: github.event_name == 'pull_request'

    steps:
      - name: Validate Branch Flow
        run: |

          SOURCE="${{ github.head_ref }}"
          TARGET="${{ github.base_ref }}"

          echo "======================================"
          echo "Source Branch : $SOURCE"
          echo "Target Branch : $TARGET"
          echo "======================================"


          if [ "$TARGET" = "testing" ]
          then

            if [ "$SOURCE" != "dev" ]
            then
              echo " Invalid branch promotion."
              echo ""
              echo "testing can only receive PRs from dev."
              echo "Allowed:"
              echo "dev → testing"
              exit 1
            fi

          fi

          if [ "$TARGET" = "main" ]
          then

            if [ "$SOURCE" != "testing" ]
            then
              echo "❌ Invalid branch promotion."
              echo ""
              echo "main can only receive PRs from testing."
              echo "Allowed:"
              echo "testing → main"
              exit 1
            fi

          fi


          echo " Branch promotion policy satisfied."

  build-and-scan:
    name: Build Docker Image & Security Scan

    needs:
      - test

    if: |
      always() &&
      github.event_name == 'push' &&
      ! (github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'testing')

    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/starlight-notes

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile

          load: true

          tags: starlight-notes:scan

          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: starlight-notes:scan
          format: table
          output: trivy-report.txt
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: 1
      - name: Display Trivy Report
        if: always()
        run: |

          echo "======================================"
          echo "        TRIVY SECURITY REPORT"
          echo "======================================"

          if [ -f trivy-report.txt ]
          then
            cat trivy-report.txt
          else
            echo "Trivy report not found."
          fi

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-report.txt
          retention-days: 7

      - name: Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile

          push: true

          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production VPS

    needs:
      - test
      - build-and-scan

    if: |
      always() &&
      (
        (github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'testing') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.result == 'success' && needs.build-and-scan.result == 'success')
      )

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Production VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ vars.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ vars.VPS_PORT }}
          script: |
            set -e
            echo "======================================"
            echo " STARTING PRODUCTION DEPLOYMENT"
            echo "======================================"


            # ==================================================
            # LOGIN TO DOCKER HUB
            # ==================================================

            echo " Logging in to Docker Hub..."

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
              docker login \
              --username "${{ vars.DOCKERHUB_USERNAME }}" \
              --password-stdin


            # ==================================================
            # PULL LATEST IMAGE
            # ==================================================

            echo " Pulling latest Docker image..."

            docker pull \
              ${{ vars.DOCKERHUB_USERNAME }}/starlight-notes:latest


            # ==================================================
            # STOP OLD CONTAINER
            # ==================================================

            echo " Stopping old container..."

            docker stop starlight-notes 2>/dev/null || true


            # ==================================================
            # REMOVE OLD CONTAINER
            # ==================================================

            echo " Removing old container..."

            docker rm starlight-notes 2>/dev/null || true


            # ==================================================
            # START NEW CONTAINER
            # ==================================================

            echo " Starting new container..."

            docker run -d \
              --name starlight-notes \
              --restart unless-stopped \
              -p 3000:3000 \
              ${{ vars.DOCKERHUB_USERNAME }}/starlight-notes:latest


            # ==================================================
            # WAIT FOR APPLICATION
            # ==================================================

            echo "⏳ Waiting for application to start..."

            sleep 5


            # ==================================================
            # VERIFY CONTAINER
            # ==================================================

            echo " Checking container status..."

            if docker ps \
              --filter "name=starlight-notes" \
              --filter "status=running" \
              | grep -q starlight-notes
            then

              echo " Container is running."

            else

              echo " Container failed to start."

              echo ""
              echo "========== CONTAINER LOGS =========="
              echo ""

              docker logs starlight-notes || true

              exit 1

            fi


            # ==================================================
            # CLEAN UNUSED IMAGES
            # ==================================================

            echo "🧹 Cleaning unused Docker images..."

            docker image prune -f


            # ==================================================
            # SUCCESS
            # ==================================================

            echo ""
            echo "======================================"
            echo " PRODUCTION DEPLOYMENT SUCCESSFUL"
            echo "======================================"
