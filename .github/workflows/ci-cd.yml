name: CI/CD Pipeline & Automated Deployment

on:
  push:
    branches:
      - testing
      - main

  pull_request:
    branches:
      - testing
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/starlight-notes

jobs:
  test_and_coverage:
    name: Run Tests & Check Coverage
    runs-on: ubuntu-latest

    outputs:
      coverage_pct: ${{ steps.coverage.outputs.pct }}
      coverage_met: ${{ steps.coverage.outputs.met }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - name: Enforce Branch Promotion Rule
        if: github.event_name == 'pull_request'
        run: |
          TARGET_BRANCH="${{ github.base_ref }}"
          SOURCE_BRANCH="${{ github.head_ref }}"

          echo "Source: $SOURCE_BRANCH"
          echo "Target: $TARGET_BRANCH"

          if [ "$TARGET_BRANCH" = "testing" ] && [ "$SOURCE_BRANCH" != "dev" ]; then
            echo " PRs targeting testing must come from dev."
            exit 1
          fi

          if [ "$TARGET_BRANCH" = "main" ] && [ "$SOURCE_BRANCH" != "testing" ]; then
            echo " PRs targeting main must come from testing."
            exit 1
          fi

          echo " Branch promotion rule passed."

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests & Coverage
        run: npm run test:coverage

      - name: Check Coverage
        id: coverage
        run: |
          COVERAGE_PCT=$(node -e "const s = require('./coverage/coverage-summary.json'); console.log(s.total.lines.pct);")

          echo "Code Coverage: ${COVERAGE_PCT}%"

          echo "pct=${COVERAGE_PCT}" >> "$GITHUB_OUTPUT"

          if node -e "process.exit(${COVERAGE_PCT} >= 80 ? 0 : 1)"; then
            echo "met=true" >> "$GITHUB_OUTPUT"
            echo " Coverage requirement met."
          else
            echo "met=false" >> "$GITHUB_OUTPUT"
            echo " Coverage requirement not met."
            exit 1
          fi

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: code-coverage-report
          path: coverage/
          retention-days: 7

  build_and_scan:
    name: Build Docker Image & Trivy Security Scan
    needs: test_and_coverage

    if: needs.test_and_coverage.result == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Login to Docker Hub
        if: |
          github.event_name == 'push' ||
          (
            github.event_name == 'pull_request' &&
            github.base_ref == 'main' &&
            github.head_ref == 'testing'
          )
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: starlight-notes:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: starlight-notes:scan
          format: table
          output: trivy-scan-report.txt
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: 1

      - name: Display Trivy Report
        if: always()
        run: |
          echo "======================================"
          echo "TRIVY SECURITY REPORT"
          echo "======================================"

          if [ -f trivy-scan-report.txt ]; then
            cat trivy-scan-report.txt
          fi

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: trivy-security-report
          path: trivy-scan-report.txt
          retention-days: 7

      - name: Push Docker Image
        if: |
          github.event_name == 'push' ||
          (
            github.event_name == 'pull_request' &&
            github.base_ref == 'main' &&
            github.head_ref == 'testing'
          )
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy_vps:
    name: Deploy Latest Image to VPS
    needs:
      - test_and_coverage
      - build_and_scan

    if: |
      needs.test_and_coverage.result == 'success' &&
      needs.build_and_scan.result == 'success' &&
      (
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        ) ||
        (
          github.event_name == 'pull_request' &&
          github.base_ref == 'main' &&
          github.head_ref == 'testing'
        )
      )

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ vars.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ vars.VPS_PORT }}

          script: |
            set -e

            echo "======================================"
            echo " STARTING PRODUCTION DEPLOYMENT"
            echo "======================================"

            echo " Logging in to Docker Hub..."

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
              docker login \
              --username "${{ vars.DOCKERHUB_USERNAME }}" \
              --password-stdin

            echo " Pulling Docker image..."

            docker pull \
              ${{ vars.DOCKERHUB_USERNAME }}/starlight-notes:${{ github.sha }}

            echo " Stopping old container..."

            docker stop starlight-notes 2>/dev/null || true

            echo "🗑️ Removing old container..."

            docker rm starlight-notes 2>/dev/null || true

            echo " Checking port 3000..."

            if sudo ss -ltnp | grep -q ':3000'; then
              echo " Port 3000 is already in use."
              sudo ss -ltnp | grep ':3000'
              exit 1
            fi

            echo " Starting new container..."

            docker run -d \
              --name starlight-notes \
              --restart unless-stopped \
              -p 3000:3000 \
              ${{ vars.DOCKERHUB_USERNAME }}/starlight-notes:${{ github.sha }}

            echo " Waiting for application..."

            sleep 5

            echo " Checking container..."

            if docker ps \
              --filter "name=starlight-notes" \
              --filter "status=running" \
              | grep -q starlight-notes
            then
              echo " Container is running."
            else
              echo " Container failed to start."
              docker logs starlight-notes || true
              exit 1
            fi

            echo " Cleaning unused Docker images..."

            docker image prune -f

            echo "======================================"
            echo " PRODUCTION DEPLOYMENT SUCCESSFUL"
            echo "======================================"
